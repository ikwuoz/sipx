<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-label="Sipx near402 architecture diagram">
  <defs>
    <!-- Backintosh 1999 woven periwinkle-lavender pixel desktop tile -->
    <pattern id="bg-weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#8E90CE" />
      <rect x="0" y="0" width="8" height="2" fill="#A9ABE6" />
      <rect x="0" y="2" width="2" height="6" fill="#A9ABE6" />
      <rect x="8" y="8" width="8" height="2" fill="#A9ABE6" />
      <rect x="8" y="10" width="2" height="6" fill="#A9ABE6" />
      <rect x="6" y="2" width="2" height="6" fill="#6F71B3" />
      <rect x="2" y="6" width="6" height="2" fill="#6F71B3" />
      <rect x="14" y="10" width="2" height="6" fill="#6F71B3" />
      <rect x="10" y="14" width="6" height="2" fill="#6F71B3" />
    </pattern>

    <!-- Classic Mac OS horizontal window titlebar pinstripes -->
    <pattern id="pinstripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FFFFFF" />
      <rect x="0" y="1" width="4" height="1" fill="#000000" />
    </pattern>

    <!-- Diagonal yellow-black 402 hazard strip -->
    <pattern id="hazard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#FFD000" />
      <rect x="6" y="0" width="6" height="12" fill="#000000" />
    </pattern>

    <!-- Crisp pixel arrowhead -->
    <marker id="arrow-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" />
    </marker>

    <style>
      .font-ui { font-family: "Pixelify Sans", "Chicago", "Geneva", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .font-mono { font-family: "VT323", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      .win-shadow { fill: #000000; }
      .win-body { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .win-cream { fill: #FFFDE6; stroke: #000000; stroke-width: 1.5; }
      .win-silver { fill: #DCDCDC; stroke: #000000; stroke-width: 1.5; }
      .win-crt { fill: #000022; stroke: #000000; stroke-width: 1.5; }
      .titlebar-line { stroke: #000000; stroke-width: 1.5; }
      .close-box { fill: #FFFFFF; stroke: #000000; stroke-width: 1.25; }

      .col-pill { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .col-txt { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #000000; }

      .win-title { font-size: 13.5px; font-weight: 700; fill: #000000; }
      .card-title { font-size: 14.5px; font-weight: 700; fill: #000000; }
      .card-sub { font-size: 12px; font-weight: 600; fill: #333333; }
      .tag-txt { font-size: 11.5px; font-weight: 700; fill: #000000; }

      .crt-title { font-size: 15px; font-weight: 700; fill: #00FF00; }
      .crt-sub { font-size: 12px; font-weight: 600; fill: #4DC4E0; }

      .edge-base { stroke: #000000; stroke-width: 2.2; fill: none; }
      .edge-pulse { stroke-width: 2.2; stroke-dasharray: 5 7; fill: none; animation: flow 1.1s linear infinite; }
      .edge-pill { fill: #FFFFFF; stroke: #000000; stroke-width: 1.25; }
      .edge-txt { font-size: 11px; font-weight: 700; fill: #000000; }

      .blink { animation: blink 1s steps(2, start) infinite; }

      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      @media (prefers-reduced-motion: reduce) {
        .edge-pulse, .blink { animation: none; }
      }
    </style>
  </defs>

  <!-- Desktop Wallpaper -->
  <rect x="0" y="0" width="920" height="490" fill="url(#bg-weave)" />

  <!-- Top Classic Mac OS Menu Bar -->
  <rect x="0" y="0" width="920" height="28" fill="#FFFFFF" />
  <line x1="0" y1="28" x2="920" y2="28" stroke="#000000" stroke-width="1.5" />
  <!-- Tiny Happy Backintosh 402 icon -->
  <rect x="14" y="6" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.25" />
  <rect x="16" y="8" width="12" height="7" fill="#000022" />
  <rect x="18" y="10" width="2" height="2" fill="#00FF00" />
  <rect x="24" y="10" width="2" height="2" fill="#00FF00" />
  <rect x="19" y="13" width="6" height="1" fill="#00FF00" />
  <text class="font-ui win-title" x="38" y="19">Sipx (near402)</text>

  <rect x="796" y="5" width="110" height="18" fill="#4DC4E0" stroke="#000000" stroke-width="1.25" />
  <text class="font-ui tag-txt" x="851" y="18" text-anchor="middle">HTTP 402 FLOW</text>

  <!-- Column Headers -->
  <rect class="col-pill" x="38" y="42" width="76" height="22" />
  <text class="font-ui col-txt" x="76" y="57" text-anchor="middle">BUYER</text>

  <rect class="col-pill" x="328" y="42" width="134" height="22" />
  <text class="font-ui col-txt" x="395" y="57" text-anchor="middle">PAYMENT RAILS</text>

  <rect class="col-pill" x="664" y="42" width="84" height="22" />
  <text class="font-ui col-txt" x="706" y="57" text-anchor="middle">SELLER</text>

  <!-- ==================== CONNECTING FLOWS ==================== -->
  <!-- 1. Human Wallet -> Agent Wallet -->
  <path id="path-fund" class="edge-base" d="M 143 153 L 143 206" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#5CD65C" d="M 143 153 L 143 204" />
  <rect class="edge-pill" x="153" y="170" width="46" height="18" />
  <text class="font-mono edge-txt" x="176" y="183" text-anchor="middle">fund</text>

  <!-- 2. Agent Wallet -> Payment Rails -->
  <path id="path-pay" class="edge-base" d="M 251 255 L 320 255" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#FFD000" d="M 251 255 L 318 255" />
  <rect class="edge-pill" x="266" y="230" width="40" height="18" />
  <text class="font-mono edge-txt" x="286" y="243" text-anchor="middle">pay</text>

  <!-- 3. Payment Rails -> Seller Wallet -->
  <path id="path-settle" class="edge-base" d="M 587 128 L 656 128" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#5CD65C" d="M 587 128 L 654 128" />
  <rect class="edge-pill" x="598" y="103" width="52" height="18" />
  <text class="font-mono edge-txt" x="624" y="116" text-anchor="middle">settle</text>

  <!-- 4. Payment Rails <-> Sipx Proxy -->
  <path id="path-verify" class="edge-base" d="M 587 255 L 656 255" marker-start="url(#arrow-blk)" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#4DC4E0" d="M 589 255 L 654 255" />
  <rect class="edge-pill" x="598" y="230" width="52" height="18" />
  <text class="font-mono edge-txt" x="624" y="243" text-anchor="middle">verify</text>

  <!-- 5. Seller Wallet <-> Sipx Proxy -->
  <path id="path-token" class="edge-base" d="M 773 153 L 773 206" marker-start="url(#arrow-blk)" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#4DC4E0" d="M 773 155 L 773 204" />
  <rect class="edge-pill" x="783" y="170" width="70" height="18" />
  <text class="font-mono edge-txt" x="818" y="183" text-anchor="middle">near402_</text>

  <!-- 6. Sipx Proxy -> NEAR AI Cloud (Request) -->
  <path id="path-infer" class="edge-base" d="M 724 299 L 724 358" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#4DC4E0" d="M 724 299 L 724 356" />
  <rect class="edge-pill" x="614" y="320" width="102" height="18" />
  <text class="font-mono edge-txt" x="665" y="333" text-anchor="middle">POST /v1/chat</text>

  <!-- 7. NEAR AI Cloud -> Sipx Proxy (SSE + TEE) -->
  <path id="path-stream" class="edge-base" d="M 822 362 L 822 303" marker-end="url(#arrow-blk)" />
  <path class="edge-pulse" stroke="#00FF00" d="M 822 362 L 822 305" />
  <rect class="edge-pill" x="830" y="320" width="74" height="18" />
  <text class="font-mono edge-txt" x="867" y="333" text-anchor="middle">SSE + TEE</text>

  <!-- ==================== BUYER WINDOWS ==================== -->
  <!-- Human Wallet -->
  <rect class="win-shadow" x="41" y="77" width="210" height="76" />
  <rect class="win-body" x="38" y="74" width="210" height="76" />
  <rect x="38" y="74" width="210" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="38" y1="96" x2="248" y2="96" />
  <rect class="close-box" x="44" y="79" width="12" height="12" />
  <rect x="64" y="76" width="108" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="118" y="90" text-anchor="middle">Human Wallet</text>
  <rect x="54" y="109" width="178" height="28" fill="#FFFDE6" stroke="#000000" stroke-width="1.25" />
  <text class="font-mono card-sub" x="143" y="127" text-anchor="middle">Browser • Fund Once</text>

  <!-- Agent Wallet -->
  <rect class="win-shadow" x="41" y="217" width="210" height="82" />
  <rect class="win-cream" x="38" y="214" width="210" height="82" />
  <rect x="38" y="214" width="210" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="38" y1="236" x2="248" y2="236" />
  <rect class="close-box" x="44" y="219" width="12" height="12" />
  <rect x="64" y="216" width="104" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="116" y="230" text-anchor="middle">Agent Wallet</text>
  <rect x="54" y="246" width="178" height="22" fill="#5CD65C" stroke="#000000" stroke-width="1.5" />
  <text class="font-ui tag-txt" x="143" y="261" text-anchor="middle">near402 SDK</text>
  <text class="font-mono card-sub" x="143" y="285" text-anchor="middle">USDC / NEAR</text>

  <!-- ==================== PAYMENT RAILS WINDOW ==================== -->
  <rect class="win-shadow" x="331" y="77" width="256" height="222" />
  <rect class="win-silver" x="328" y="74" width="256" height="222" />
  <rect x="328" y="74" width="256" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="328" y1="96" x2="584" y2="96" />
  <rect class="close-box" x="334" y="79" width="12" height="12" />
  <rect x="388" y="76" width="136" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="456" y="90" text-anchor="middle">402 Settlement</text>

  <!-- Inner Rail 1: NEAR Direct -->
  <rect class="win-shadow" x="346" y="112" width="224" height="76" />
  <rect class="win-body" x="344" y="110" width="224" height="76" />
  <rect x="344" y="110" width="224" height="22" fill="#4DC4E0" stroke="#000000" stroke-width="1.25" />
  <text class="font-ui card-title" x="456" y="126" text-anchor="middle">NEAR Direct</text>
  <text class="font-mono card-sub" x="456" y="152" text-anchor="middle">NEAR RPC • USDC / NEAR</text>
  <text class="font-mono card-sub" x="456" y="171" text-anchor="middle">FINALITY</text>

  <!-- Inner Rail 2: 1Click Intents -->
  <rect class="win-shadow" x="346" y="202" width="224" height="78" />
  <rect class="win-cream" x="344" y="200" width="224" height="78" />
  <rect x="344" y="200" width="224" height="22" fill="#FFD000" stroke="#000000" stroke-width="1.25" />
  <text class="font-ui card-title" x="456" y="216" text-anchor="middle">NEAR Intents (1Click)</text>
  <text class="font-mono card-sub" x="456" y="242" text-anchor="middle">EVM / SOL / TON ⇄ NEAR</text>
  <text class="font-mono card-sub" x="456" y="261" text-anchor="middle">CROSS-CHAIN</text>

  <!-- ==================== SELLER WINDOWS ==================== -->
  <!-- Seller Wallet -->
  <rect class="win-shadow" x="667" y="77" width="218" height="76" />
  <rect class="win-cream" x="664" y="74" width="218" height="76" />
  <rect x="664" y="74" width="218" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="664" y1="96" x2="882" y2="96" />
  <rect class="close-box" x="670" y="79" width="12" height="12" />
  <rect x="708" y="76" width="118" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="767" y="90" text-anchor="middle">Seller Wallet</text>
  <rect x="680" y="109" width="186" height="28" fill="#FFFFFF" stroke="#000000" stroke-width="1.25" />
  <text class="font-mono card-sub" x="773" y="127" text-anchor="middle">USDC / NEAR Treasury</text>

  <!-- Sipx Proxy -->
  <rect class="win-shadow" x="667" y="217" width="218" height="82" />
  <rect class="win-body" x="664" y="214" width="218" height="82" />
  <rect x="664" y="214" width="218" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="664" y1="236" x2="882" y2="236" />
  <rect class="close-box" x="670" y="219" width="12" height="12" />
  <rect x="716" y="216" width="102" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="767" y="230" text-anchor="middle">Sipx Proxy</text>
  <!-- 402 Hazard mini strip -->
  <rect x="680" y="246" width="186" height="22" fill="url(#hazard)" stroke="#000000" stroke-width="1.5" />
  <rect x="720" y="249" width="106" height="16" fill="#FFD000" stroke="#000000" stroke-width="1" />
  <text class="font-ui tag-txt" x="773" y="261" text-anchor="middle">402 + METER</text>
  <text class="font-mono card-sub" x="773" y="285" text-anchor="middle">near402-proxy</text>

  <!-- ==================== NEAR AI CLOUD (CRT TERMINAL) ==================== -->
  <rect class="win-shadow" x="331" y="369" width="554" height="92" />
  <rect class="win-silver" x="328" y="366" width="554" height="92" />
  <rect x="328" y="366" width="554" height="22" fill="url(#pinstripes)" />
  <line class="titlebar-line" x1="328" y1="388" x2="882" y2="388" />
  <rect class="close-box" x="334" y="371" width="12" height="12" />
  <rect x="525" y="368" width="160" height="18" fill="#FFFFFF" />
  <text class="font-ui win-title" x="605" y="382" text-anchor="middle">NEAR AI Cloud</text>

  <rect class="win-crt" x="336" y="395" width="538" height="55" />
  <text class="font-mono crt-title" x="354" y="422">&gt; Intel TDX + NVIDIA TEE — Private Inference</text>
  <text class="font-mono crt-sub" x="354" y="440">VERIFIABLE ATTESTATION • TOKEN METERING</text>
  <!-- Blinking CRT cursor -->
  <rect class="blink" x="760" y="410" width="9" height="14" fill="#00FF00" />

  <!-- ==================== ANIMATED PIXEL PACKETS ==================== -->
  <!-- Yellow payment packet: Agent -> Rails -->
  <rect x="-4" y="-4" width="8" height="8" fill="#FFD000" stroke="#000000" stroke-width="1.25">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 251 255 L 320 255" />
  </rect>
  <!-- Green settlement packet: Rails -> Seller -->
  <rect x="-4" y="-4" width="8" height="8" fill="#5CD65C" stroke="#000000" stroke-width="1.25">
    <animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 587 128 L 656 128" />
  </rect>
  <!-- Cyan request packet: Proxy -> TEE -->
  <rect x="-4" y="-4" width="8" height="8" fill="#4DC4E0" stroke="#000000" stroke-width="1.25">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 724 299 L 724 358" />
  </rect>
  <!-- Phosphor green SSE stream packet: TEE -> Proxy -->
  <rect x="-4" y="-4" width="8" height="8" fill="#00FF00" stroke="#000000" stroke-width="1.25">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 822 362 L 822 303" />
  </rect>
</svg>
